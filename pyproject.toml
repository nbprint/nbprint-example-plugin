[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "nbprint-example-plugin"
authors = [
    {name = "the nbprint authors", email = "3105306+timkpaine@users.noreply.github.com"},
]
description = "Example hydra plugin for nbprint"
readme = "README.md"
license = { text = "Apache-2.0" }
